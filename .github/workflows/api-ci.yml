name: API CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
  push:
    branches:
      - dev

jobs:
  api-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @todam/api exec prisma generate
      - run: pnpm --filter @todam/api typecheck
      - run: pnpm --filter @todam/api lint
