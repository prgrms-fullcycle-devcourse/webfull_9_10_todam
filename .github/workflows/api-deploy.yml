name: API Docker Build and Push

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.dockerignore'
      - '.github/workflows/api-deploy.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -f apps/api/Dockerfile -t ${{ secrets.ECR_REPOSITORY }} .

      - name: Tag Docker image
        run: |
          docker tag ${{ secrets.ECR_REPOSITORY }}:latest ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            IMAGE="$REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest"

            docker container prune -f
            docker image prune -af
            df -h /

            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin "$REGISTRY"

            docker pull "$IMAGE"

            docker stop todam-api || true
            docker rm todam-api || true

            docker run -d \
              --name todam-api \
              --network todam-net \
              --restart unless-stopped \
              --env-file .env.api \
              -e FRONTEND_URL=${{ secrets.FRONTEND_URL }} \
              -p 127.0.0.1:4000:4000 \
              "$IMAGE"

            echo "Waiting for todam-api to become healthy..."
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:4000/health/db > /dev/null 2>&1; then
                echo "todam-api is healthy"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed. Recent container logs:"
            docker logs --tail 50 todam-api || true
            exit 1
