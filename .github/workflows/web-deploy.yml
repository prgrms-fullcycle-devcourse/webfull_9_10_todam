name: Web Docker Build and Push

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.dockerignore'
      - '.github/workflows/web-deploy.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_WEB }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_WEB }}
          aws-region: ${{ secrets.AWS_REGION_WEB }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_WEB }} \
            --build-arg NEXT_PUBLIC_KAKAO_MAP_KEY=${{ secrets.NEXT_PUBLIC_KAKAO_MAP_KEY_WEB }} \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY_WEB }} \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_WEB }} \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID_WEB }} \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_WEB }} \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_WEB }} \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID_WEB }} \
            --build-arg NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY_WEB }} \
            -t ${{ secrets.ECR_REPOSITORY_WEB }} .

      - name: Tag Docker image
        run: |
          docker tag ${{ secrets.ECR_REPOSITORY_WEB }}:latest ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_WEB }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_WEB }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_WEB }}
          username: ${{ secrets.EC2_USER_WEB }}
          key: ${{ secrets.EC2_SSH_KEY_WEB }}
          script: |
            set -euo pipefail

            REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            IMAGE="$REGISTRY/${{ secrets.ECR_REPOSITORY_WEB }}:latest"

            # 옛 컨테이너를 먼저 내려야 옛 이미지가 prune 대상이 됨(디스크 확보 후 pull).
            docker stop todam-web || true
            docker rm todam-web || true

            docker container prune -f
            docker image prune -af
            df -h /

            aws ecr get-login-password --region ${{ secrets.AWS_REGION_WEB }} | docker login --username AWS --password-stdin "$REGISTRY"

            docker pull "$IMAGE"

            docker run -d \
              --name todam-web \
              --restart unless-stopped \
              --env-file .env.web \
              -p 80:3000 \
              "$IMAGE"

            echo "Waiting for todam-web to become healthy..."
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:80 > /dev/null 2>&1; then
                echo "todam-web is healthy"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed. Recent container logs:"
            docker logs --tail 50 todam-web || true
            exit 1
