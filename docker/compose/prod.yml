services:
  api:
    image: todam/api:latest
    env_file:
      - .env.api

  web:
    image: todam/web:latest
    env_file:
      - .env.web

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web